<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f8e1e0">
<meta name="color-scheme" content="light">
<title>♡</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body class="is-loading">
  <div id="loading" class="screen loading" aria-label="Loading">
    <div class="pulse-heart" aria-hidden="true"></div>
  </div>

  <main id="locked" class="screen locked" hidden>
    <div class="pulse-heart" aria-hidden="true"></div>
    <h1>Tap the card to open</h1>
    <p>Hold it against the top of your phone.</p>
    <p id="lock-msg" class="lock-msg" hidden></p>
  </main>

  <div id="envelope" class="envelope-screen" hidden>
    <button id="envelope-btn" class="envelope" type="button">
      <span class="env-back" aria-hidden="true"></span>
      <span class="env-letter" aria-hidden="true"></span>
      <span class="env-front" aria-hidden="true"></span>
      <span class="env-flap" aria-hidden="true"></span>
      <span class="env-seal" aria-hidden="true"></span>
      <span id="envelope-to" class="env-to"></span>
    </button>
    <p class="env-hint">tap to open</p>
  </div>

  <main id="app" class="app" hidden></main>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
</body>
</html>
